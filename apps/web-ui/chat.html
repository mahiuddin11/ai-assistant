<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SAMAD - Chat</title>
    <script>
        /* apply saved theme before paint (no flash) */
        try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) { }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <style>
        @property --a {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        :root {
            --bg: #08101d;
            --bg-2: #0b1a2b;
            --b1: #2c5fae;
            --b2: #1d8a92;
            --b3: #4f9fd6;
            --o1: 0.3;
            --o2: 0.2;
            --o3: 0.12;
            --panel: rgba(15, 25, 43, 0.6);
            --panel-line: rgba(190, 215, 255, 0.1);
            --surface: rgba(190, 215, 255, 0.06);
            --surface-hover: rgba(190, 215, 255, 0.11);
            --field: #0d1a2c;
            --text: #e8eff9;
            --muted: #8a9bb8;
            --accent: #4f8cff;
            --accent-2: #2bc4c0;
            --accent-3: #7fb4ff;
            --danger: #ff6b7a;
            --shadow: 0 40px 120px -30px rgba(0, 0, 0, 0.75);
            --font: "Manrope", "Hind Siliguri", system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        :root[data-theme="light"] {
            --bg: #eef4fb;
            --bg-2: #e3eefa;
            --b1: #8fc0f0;
            --b2: #9adbd8;
            --b3: #c4d9f7;
            --o1: 0.6;
            --o2: 0.45;
            --o3: 0.5;
            --panel: rgba(255, 255, 255, 0.62);
            --panel-line: rgba(30, 60, 110, 0.1);
            --surface: rgba(255, 255, 255, 0.75);
            --surface-hover: #ffffff;
            --field: #ffffff;
            --text: #122038;
            --muted: #5a6b88;
            --shadow: 0 40px 100px -30px rgba(50, 90, 150, 0.3);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            overflow: hidden;
            transition: background 0.5s, color 0.5s;
            -webkit-font-smoothing: antialiased;
        }

        /* =========== animated background =========== */
        .bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
            background: linear-gradient(165deg, var(--bg), var(--bg-2));
            transition: background 0.5s;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(110px);
            will-change: transform;
            transition: opacity 0.6s;
        }

        .b1 {
            width: 60vmax;
            height: 60vmax;
            background: var(--b1);
            opacity: var(--o1);
            top: -24vmax;
            left: -18vmax;
            animation: drift1 70s ease-in-out infinite alternate;
        }

        .b2 {
            width: 55vmax;
            height: 55vmax;
            background: var(--b2);
            opacity: var(--o2);
            bottom: -26vmax;
            right: -16vmax;
            animation: drift2 80s ease-in-out infinite alternate;
        }

        .b3 {
            width: 42vmax;
            height: 42vmax;
            background: var(--b3);
            opacity: var(--o3);
            top: 35%;
            left: 38%;
            animation: drift3 90s ease-in-out infinite alternate;
        }

        @keyframes drift1 {
            to {
                transform: translate(14vmax, 12vmax) scale(1.12);
            }
        }

        @keyframes drift2 {
            to {
                transform: translate(-14vmax, -10vmax) scale(1.1);
            }
        }

        @keyframes drift3 {
            to {
                transform: translate(-10vmax, 8vmax) scale(0.9);
            }
        }

        .grain {
            position: absolute;
            inset: 0;
            opacity: 0.035;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        }

        /* =========== shell + glass panel =========== */
        .shell {
            position: relative;
            z-index: 1;
            height: 100dvh;
            padding: clamp(0px, 2.2vw, 28px);
            display: flex;
            justify-content: center;
        }

        .panel {
            position: relative;
            width: 100%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--panel);
            border: 1px solid var(--panel-line);
            border-radius: 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(26px) saturate(150%);
            -webkit-backdrop-filter: blur(26px) saturate(150%);
            overflow: hidden;
            animation: panel-in 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        @keyframes panel-in {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.985);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* =========== header =========== */
        header {
            padding: calc(0.85rem + env(safe-area-inset-top, 0px)) 1.1rem 0.85rem 1.3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.25;
        }

        .brand-text b {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.01em;
        }

        .brand-text small {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.74rem;
            color: var(--muted);
            font-weight: 500;
        }

        .brand-text small i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #3ddc97;
            box-shadow: 0 0 0 0 rgba(61, 220, 151, 0.6);
            animation: ping 2.6s infinite;
        }

        @keyframes ping {
            70% {
                box-shadow: 0 0 0 7px rgba(61, 220, 151, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(61, 220, 151, 0);
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .icon-btn,
        .settings-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            height: 38px;
            padding: 0 0.7rem;
            color: var(--muted);
            background: transparent;
            border: 1px solid transparent;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s, background 0.2s, border-color 0.2s, transform 0.2s;
        }

        .icon-btn:hover,
        .settings-link:hover {
            color: var(--text);
            background: var(--surface-hover);
        }

        .icon-btn:active {
            transform: scale(0.94);
        }

        .icon-btn.logout:hover {
            color: var(--danger);
            background: rgba(255, 107, 122, 0.1);
        }

        .icon-btn svg,
        .settings-link svg {
            width: 18px;
            height: 18px;
            flex: none;
        }

        .theme-btn .sun {
            display: none;
        }

        :root[data-theme="light"] .theme-btn .sun {
            display: block;
        }

        :root[data-theme="light"] .theme-btn .moon {
            display: none;
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* =========== avatars =========== */
        .avatar {
            flex: none;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: block;
        }

        .avatar svg {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: inherit;
        }

        .avatar.sm {
            margin-top: 2px;
        }

        .avatar.lg {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 20px -6px rgba(79, 140, 255, 0.6);
        }

        .avatar.xl {
            width: 88px;
            height: 88px;
            border-radius: 26px;
            box-shadow: 0 20px 60px -16px rgba(79, 140, 255, 0.6);
        }

        .avatar.live {
            animation: breathe 6s ease-in-out infinite;
        }

        .avatar.think {
            animation: glow 1.4s ease-in-out infinite;
        }

        .avatar.user {
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #fff;
            background: linear-gradient(135deg, #64748b, #3b4a63);
        }

        .avatar.user svg {
            width: 58%;
            height: 58%;
            border-radius: 0;
        }

        @keyframes breathe {
            50% {
                transform: translateY(-3px);
            }
        }

        @keyframes glow {
            50% {
                box-shadow: 0 0 0 6px rgba(79, 140, 255, 0.2);
            }
        }

        /* =========== messages =========== */
        #messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 1.6rem 1.3rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.15rem;
            scroll-behavior: smooth;
        }

        #messages>* {
            width: 100%;
            max-width: 740px;
            margin-left: auto;
            margin-right: auto;
        }

        #messages::-webkit-scrollbar {
            width: 8px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: var(--panel-line);
            border-radius: 8px;
        }

        /* welcome */
        .welcome {
            margin-top: 3vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .welcome.hide {
            display: none;
        }

        .hero {
            position: relative;
            width: 110px;
            height: 110px;
            display: grid;
            place-items: center;
            animation: rise 0.9s 0.15s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .hero::before,
        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid var(--accent);
            opacity: 0;
            animation: ring 5s ease-out infinite;
        }

        .hero::after {
            animation-delay: 2.5s;
            border-color: var(--accent-2);
        }

        @keyframes ring {
            0% {
                transform: scale(0.75);
                opacity: 0.55;
            }

            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        .welcome h1 {
            margin: 1.4rem 0 0.4rem;
            font-size: clamp(1.5rem, 4.4vw, 2.1rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            animation: rise 0.9s 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .welcome p {
            margin: 0;
            color: var(--muted);
            font-size: 0.97rem;
            line-height: 1.6;
            max-width: 400px;
            animation: rise 0.9s 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .cards {
            margin-top: 1.8rem;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.7rem;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            text-align: left;
            padding: 0.85rem 0.95rem;
            font-family: inherit;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--panel-line);
            border-radius: 16px;
            cursor: pointer;
            animation: rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
            animation-delay: calc(0.5s + var(--i) * 0.08s);
            transition: transform 0.25s, border-color 0.25s, background 0.25s, box-shadow 0.25s;
        }

        .card:hover {
            transform: translateY(-3px);
            background: var(--surface-hover);
            border-color: rgba(79, 140, 255, 0.55);
            box-shadow: 0 14px 34px -14px rgba(79, 140, 255, 0.5);
        }

        .card-ic {
            flex: none;
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: var(--accent);
            background: rgba(79, 140, 255, 0.14);
            transition: transform 0.3s;
        }

        .card:nth-child(2) .card-ic {
            color: var(--accent-2);
            background: rgba(43, 196, 192, 0.14);
        }

        .card:nth-child(3) .card-ic {
            color: #ff7a8a;
            background: rgba(255, 122, 138, 0.14);
        }

        .card:nth-child(4) .card-ic {
            color: var(--accent-3);
            background: rgba(127, 180, 255, 0.14);
        }

        .card:hover .card-ic {
            transform: rotate(-8deg) scale(1.08);
        }

        .card-ic svg {
            width: 19px;
            height: 19px;
        }

        .card b {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .card span.sub {
            display: block;
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 2px;
        }

        /* rows */
        .row {
            display: flex;
            gap: 0.7rem;
            align-items: flex-start;
            animation: pop 0.45s cubic-bezier(0.2, 0.8, 0.3, 1) both;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
                filter: blur(4px);
            }

            to {
                opacity: 1;
                transform: none;
                filter: blur(0);
            }
        }

        .row.user {
            justify-content: flex-end;
        }

        .stack {
            display: flex;
            flex-direction: column;
            max-width: min(80%, 640px);
            min-width: 0;
        }

        .row.user .stack {
            align-items: flex-end;
        }

        .msg {
            line-height: 1.65;
            font-size: 0.97rem;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .msg.user {
            color: #fff;
            padding: 0.75rem 1.1rem;
            border-radius: 20px 20px 6px 20px;
            background: linear-gradient(135deg, #4f8cff, #2a9fd6);
            box-shadow: 0 10px 28px -10px rgba(79, 140, 255, 0.8);
        }

        .msg.assistant {
            padding: 0.8rem 1.1rem;
            border-radius: 6px 20px 20px 20px;
            background: var(--surface);
            border: 1px solid var(--panel-line);
        }

        .msg.error {
            border-color: rgba(255, 107, 122, 0.45);
            background: rgba(255, 107, 122, 0.08);
        }

        .meta {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            margin-top: 0.35rem;
            padding: 0 0.3rem;
            font-size: 0.7rem;
            color: var(--muted);
        }

        .provider-tag {
            font-weight: 600;
        }

        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.15rem 0.4rem;
            font-family: inherit;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--muted);
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s, color 0.2s, background 0.2s;
        }

        .row:hover .copy-btn,
        .copy-btn:focus-visible {
            opacity: 1;
        }

        .copy-btn:hover {
            color: var(--text);
            background: var(--surface-hover);
        }

        .copy-btn.done {
            color: #3ddc97;
            opacity: 1;
        }

        .copy-btn svg {
            width: 13px;
            height: 13px;
        }

        @media (hover: none) {
            .copy-btn {
                opacity: 1;
            }
        }

        /* typing */
        .typing {
            display: inline-flex;
            gap: 5px;
            padding: 1rem 1.1rem !important;
        }

        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            animation: bounce 1.2s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-6px);
                opacity: 1;
                background: var(--accent-2);
            }
        }

        /* =========== composer =========== */
        #input-area {
            position: relative;
            padding: 0.5rem 1.2rem calc(0.9rem + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .composer-wrap {
            --a: 0deg;
            width: 100%;
            max-width: 740px;
            padding: 1.5px;
            border-radius: 22px;
            background: var(--panel-line);
            transition: box-shadow 0.4s;
        }

        .composer-wrap:focus-within {
            background: conic-gradient(from var(--a), var(--accent), var(--accent-2), var(--accent-3), var(--accent));
            animation: turn 5s linear infinite;
            box-shadow: 0 16px 50px -18px rgba(79, 140, 255, 0.55);
        }

        @keyframes turn {
            to {
                --a: 360deg;
            }
        }

        .composer {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.4rem 0.4rem 1.15rem;
            background: var(--field);
            border-radius: 20.5px;
        }

        #input-area input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: inherit;
            font-size: 0.98rem;
            padding: 0.7rem 0;
        }

        #input-area input::placeholder {
            color: var(--muted);
        }

        #input-area button.send {
            flex: none;
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border: none;
            border-radius: 15px;
            color: #fff;
            background: linear-gradient(135deg, #4f8cff, #2a9fd6);
            cursor: pointer;
            box-shadow: 0 8px 20px -8px rgba(79, 140, 255, 0.9);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #input-area button.send:hover {
            transform: translateY(-1px) scale(1.05);
            box-shadow: 0 12px 26px -8px rgba(79, 140, 255, 1);
        }

        #input-area button.send:active {
            transform: scale(0.92);
        }

        #input-area button.send svg {
            width: 19px;
            height: 19px;
            transition: transform 0.3s;
        }

        #input-area button.send:hover svg {
            transform: translate(2px, -2px);
        }

        .hint {
            font-size: 0.72rem;
            color: var(--muted);
        }

        .hint kbd {
            font-family: inherit;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 5px;
            border: 1px solid var(--panel-line);
            background: var(--surface);
        }

        .to-bottom {
            position: absolute;
            top: -46px;
            left: 50%;
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            color: var(--text);
            background: var(--field);
            border: 1px solid var(--panel-line);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translate(-50%, 10px) scale(0.85);
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
        }

        .to-bottom.show {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
            pointer-events: auto;
        }

        .to-bottom svg {
            width: 17px;
            height: 17px;
        }

        /* =========== permission modal =========== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10;
            background: rgba(4, 6, 14, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
            animation: fade 0.25s ease both;
        }

        @keyframes fade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-box {
            width: 100%;
            max-width: 370px;
            padding: 1.7rem;
            background: var(--field);
            border: 1px solid var(--panel-line);
            border-radius: 24px;
            box-shadow: 0 40px 90px -20px rgba(0, 0, 0, 0.7);
            animation: modal-in 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
        }

        @keyframes modal-in {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.93);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .modal-icon {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            color: var(--accent);
            background: rgba(79, 140, 255, 0.15);
            margin-bottom: 1rem;
        }

        .modal-icon svg {
            width: 24px;
            height: 24px;
        }

        .modal-box h3 {
            margin: 0 0 0.4rem;
            font-size: 1.12rem;
            font-weight: 700;
        }

        .modal-box p {
            margin: 0;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .modal-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }

        .modal-actions button {
            flex: 1;
            padding: 0.78rem;
            border: none;
            border-radius: 13px;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, filter 0.2s;
        }

        .modal-actions button:active {
            transform: scale(0.96);
        }

        .modal-actions button:hover {
            filter: brightness(1.1);
        }

        .btn-allow {
            background: linear-gradient(135deg, #4f8cff, #2a9fd6);
            color: #fff;
        }

        .btn-deny {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--panel-line) !important;
        }

        /* =========== responsive =========== */
        @media (max-width: 640px) {
            .shell {
                padding: 0;
            }

            .panel {
                border-radius: 0;
                border: none;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .stack {
                max-width: 88%;
            }

            .settings-link span,
            .brand-text small {
                display: none;
            }

            .hint {
                display: none;
            }

            #messages {
                padding: 1.2rem 0.9rem 0.8rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#4f8cff" />
                <stop offset="1" stop-color="#22c1c3" />
            </linearGradient>
        </defs>
        <symbol id="samad-logo" viewBox="0 0 48 48">
            <rect width="48" height="48" rx="14" fill="url(#lg)" />
            <path d="M22 12c1.4 8 5 11.6 13 13-8 1.4-11.6 5-13 13-1.4-8-5-11.6-13-13 8-1.4 11.6-5 13-13z" fill="#fff" />
            <path d="M37 8c.4 2.6 1.6 3.8 4.2 4.2-2.6.4-3.8 1.6-4.2 4.2-.4-2.6-1.6-3.8-4.2-4.2 2.6-.4 3.8-1.6 4.2-4.2z"
                fill="#fff" opacity=".8" />
        </symbol>
    </svg>
    <div class="bg" aria-hidden="true">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
        <div class="grain"></div>
    </div>

    <div class="shell">
        <div class="panel">
            <header>
                <div class="brand">
                    <div class="avatar lg live"><svg viewBox="0 0 48 48">
                            <use href="#samad-logo" />
                        </svg></div>
                    <div class="brand-text">
                        <b>Max AI Assistant</b>
                        <small><i></i>Online</small>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn theme-btn" onclick="toggleTheme()" aria-label="Toggle theme"
                        title="Toggle theme">
                        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                        </svg>
                        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4" />
                            <path
                                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                        </svg>
                    </button>
                    <a class="settings-link" href="settings.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
                        </svg>
                        <span>Settings</span>
                    </a>
                    <button class="icon-btn logout" onclick="logout()" aria-label="Log out" title="Log out">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                            <path d="M16 17l5-5-5-5" />
                            <path d="M21 12H9" />
                        </svg>
                    </button>
                </div>
            </header>

            <div class="modal-overlay" id="permissionModal">
                <div class="modal-box">
                    <div class="modal-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3l8 3v6c0 4.5-3.2 8.3-8 9-4.8-.7-8-4.5-8-9V6l8-3z" />
                            <path d="M9 12l2 2 4-4" />
                        </svg>
                    </div>
                    <h3>Permission Request</h3>
                    <p id="permissionText">The assistant wants to use a tool.</p>
                    <div class="modal-actions">
                        <button class="btn-deny" onclick="respondToPermission(false)">Deny</button>
                        <button class="btn-allow" onclick="respondToPermission(true)">Allow</button>
                    </div>
                </div>
            </div>

            <div id="messages">
                <div class="welcome" id="welcome">
                    <div class="hero">
                        <div class="avatar xl live"><svg viewBox="0 0 48 48">
                                <use href="#samad-logo" />
                            </svg></div>
                    </div>
                    <h1>Hello! What can I help with?</h1>
                    <p>Ask a question, paste some text, or pick a starting point below.</p>
                    <div class="cards">
                        <button class="card" style="--i:0" data-prompt="Summarize a document"
                            onclick="useSuggestion(this.dataset.prompt)">
                            <span class="card-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
                                    <path d="M14 3v5h5M9 13h6M9 17h4" />
                                </svg></span>
                            <span><b>Summarize a document</b><span class="sub">Turn long text into key
                                    points</span></span>
                        </button>
                        <button class="card" style="--i:1" data-prompt="Help me write an email"
                            onclick="useSuggestion(this.dataset.prompt)">
                            <span class="card-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="5" width="18" height="14" rx="2" />
                                    <path d="M3 7l9 6 9-6" />
                                </svg></span>
                            <span><b>Write an email</b><span class="sub">Draft a clear, polite message</span></span>
                        </button>
                        <button class="card" style="--i:2" data-prompt="Explain this error"
                            onclick="useSuggestion(this.dataset.prompt)">
                            <span class="card-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13.5 6l-3 12" />
                                </svg></span>
                            <span><b>Explain an error</b><span class="sub">Paste it and get a plain fix</span></span>
                        </button>
                        <button class="card" style="--i:3" data-prompt="Help me brainstorm ideas"
                            onclick="useSuggestion(this.dataset.prompt)">
                            <span class="card-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 18h6M10 21h4" />
                                    <path
                                        d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" />
                                </svg></span>
                            <span><b>Brainstorm ideas</b><span class="sub">Get fresh angles on a problem</span></span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="input-area">
                <button class="to-bottom" id="toBottom" aria-label="Scroll to latest message"
                    onclick="scrollToBottom()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M12 5v14M6 13l6 6 6-6" />
                    </svg>
                </button>
                <div class="composer-wrap">
                    <div class="composer">
                        <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off"
                            onkeydown="if(event.key==='Enter') sendMessage()" />
                        <button class="send" onclick="sendMessage()" aria-label="Send message">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14" />
                                <path d="M13 6l6 6-6 6" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="hint">Press <kbd>Enter</kbd> to send</div>
            </div>
        </div>
    </div>

    <script>
        const CONVERSATION_SERVICE_URL = "http://localhost:8002";
        let conversationId = null;

        if (!localStorage.getItem("access_token")) {
            window.location.href = "index.html";
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        /* ---------- UI helpers (presentation only) ---------- */
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function toggleTheme() {
            const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
            document.documentElement.dataset.theme = next;
            try { localStorage.setItem("theme", next); } catch (e) { }
        }

        function useSuggestion(text) {
            const input = document.getElementById("messageInput");
            input.value = text.trim();
            input.focus();
        }

        function hideWelcome() {
            const w = document.getElementById("welcome");
            if (w) w.classList.add("hide");
        }

        function makeAvatar(extra) {
            const a = document.createElement("div");
            a.className = "avatar sm" + (extra ? " " + extra : "");
            a.innerHTML = '<svg viewBox="0 0 48 48" aria-hidden="true"><use href="#samad-logo"/></svg>';
            return a;
        }

        function makeUserAvatar() {
            const a = document.createElement("div");
            a.className = "avatar sm user";
            a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>';
            return a;
        }

        function scrollToBottom() {
            const el = document.getElementById("messages");
            el.scrollTop = el.scrollHeight;
        }

        function timeNow() {
            return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }

        function typeOut(el, full) {
            const len = full.length;
            const dur = Math.min(1600, Math.max(350, len * 9));
            const start = performance.now();
            function step(now) {
                const p = Math.min(1, (now - start) / dur);
                el.textContent = full.slice(0, Math.ceil(len * p));
                scrollToBottom();
                if (p < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function makeCopyButton(text) {
            const btn = document.createElement("button");
            btn.className = "copy-btn";
            btn.type = "button";
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><span>Copy</span>';
            btn.onclick = async () => {
                try {
                    await navigator.clipboard.writeText(text);
                    btn.classList.add("done");
                    btn.lastChild.textContent = "Copied";
                    setTimeout(() => { btn.classList.remove("done"); btn.lastChild.textContent = "Copy"; }, 1600);
                } catch (e) { /* clipboard unavailable */ }
            };
            return btn;
        }

        function showTyping() {
            hideWelcome();
            const messagesEl = document.getElementById("messages");
            const row = document.createElement("div");
            row.className = "row assistant";
            row.id = "typingRow";
            row.appendChild(makeAvatar("think"));
            const bubble = document.createElement("div");
            bubble.className = "msg assistant typing";
            bubble.innerHTML = "<span></span><span></span><span></span>";
            row.appendChild(bubble);
            messagesEl.appendChild(row);
            scrollToBottom();
        }

        function hideTyping() {
            const row = document.getElementById("typingRow");
            if (row) row.remove();
        }

        /* ---------- original logic ---------- */
        function appendMessage(role, content, provider) {
            hideWelcome();
            const messagesEl = document.getElementById("messages");

            const row = document.createElement("div");
            row.className = `row ${role}`;

            const stack = document.createElement("div");
            stack.className = "stack";

            const div = document.createElement("div");
            div.className = `msg ${role}`;
            const isError = role === "assistant" && /^Error:/.test(content);
            if (isError) div.classList.add("error");

            const textEl = document.createElement("span");
            textEl.className = "msg-text";
            div.appendChild(textEl);
            stack.appendChild(div);

            const meta = document.createElement("div");
            meta.className = "meta";
            const time = document.createElement("span");
            time.textContent = timeNow();
            meta.appendChild(time);
            if (role === "assistant") {
                const tag = document.createElement("span");
                tag.className = "provider-tag";
                tag.textContent = "Max AI Assistant";
                /* tag.textContent = provider || document.querySelector(".brand-text b").textContent; */
                meta.appendChild(tag);
            }
            if (role === "assistant" && !isError) meta.appendChild(makeCopyButton(content));
            stack.appendChild(meta);

            if (role === "assistant") row.appendChild(makeAvatar());
            row.appendChild(stack);
            if (role === "user") row.appendChild(makeUserAvatar());
            messagesEl.appendChild(row);

            if (role === "assistant" && !isError && !reduceMotion) {
                typeOut(textEl, content);
            } else {
                textEl.textContent = content;
            }
            scrollToBottom();
        }

        async function ensureConversation() {
            if (conversationId) return conversationId;
            const res = await fetch(`${CONVERSATION_SERVICE_URL}/v1/conversations`, { method: "POST" });
            const data = await res.json();
            conversationId = data.conversation_id;
            return conversationId;
        }

        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const message = input.value.trim();
            if (!message) return;

            appendMessage("user", message);
            input.value = "";

            const convId = await ensureConversation();

            showTyping();

            try {
                // ব্যাকএন্ডের সঠিক রাউট (/v1/test/chat) এবং বডি (conversation_id ও message) ব্যবহার করা হয়েছে
                const res = await fetch(`${CONVERSATION_SERVICE_URL}/v1/test/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        conversation_id: convId,
                        message: message
                    }),
                });

                const data = await res.json();
                hideTyping();

                if (!res.ok) {
                    appendMessage("assistant", `Error: ${data.detail || "Something went wrong"}`);
                    return;
                }

                appendMessage("assistant", data.reply, data.provider_used);

            } catch (e) {
                hideTyping();
                appendMessage("assistant", "Error: Cannot reach conversation service.");
            }
        }


        const AUTH_SERVICE_URL = "http://localhost:8001";
        let pendingToolName = null;
        let permissionResolver = null;

        function requestToolPermission(toolName) {
            pendingToolName = toolName;
            document.getElementById("permissionText").textContent =
                `The assistant wants to use "${toolName}". Allow this?`;
            document.getElementById("permissionModal").classList.add("active");

            return new Promise((resolve) => {
                permissionResolver = resolve;
            });
        }

        async function respondToPermission(allowed) {
            document.getElementById("permissionModal").classList.remove("active");

            const userId = localStorage.getItem("user_id");
            if (allowed && userId) {
                try {
                    await fetch(`${AUTH_SERVICE_URL}/v1/permissions/grant`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ user_id: userId, tool_name: pendingToolName }),
                    });
                } catch (e) {
                    console.error("Failed to grant permission", e);
                }
            }

            if (permissionResolver) permissionResolver(allowed);
        }

        // ম্যানুয়াল টেস্টের জন্য — কনসোল থেকে চালানো যাবে: testToolPermissionFlow("web_search")
        async function testToolPermissionFlow(toolName) {
            const allowed = await requestToolPermission(toolName);
            appendMessage("assistant", allowed
                ? `✅ Permission granted for "${toolName}". Tool would now run.`
                : `❌ Permission denied for "${toolName}".`);
        }

        /* ---------- UI: scroll button ---------- */
        (function initUI() {
            const box = document.getElementById("messages");
            const btn = document.getElementById("toBottom");
            box.addEventListener("scroll", () => {
                const away = box.scrollHeight - box.scrollTop - box.clientHeight;
                btn.classList.toggle("show", away > 160);
            });

        })();
    </script>
</body>

</html>
