<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Assistant — Log In</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #1a1d24;
            --border: #2a2d36;
            --text: #e4e6eb;
            --text-dim: #8b8f99;
            --primary: #4f8cff;
            --primary-hover: #3d76e0;
            --error: #ff6b6b;
            --success: #4ade80;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #161a22, var(--bg));
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .card {
            background: var(--card);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            border-radius: 12px;
            margin: 0 auto 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
            margin: 0 0 0.3rem;
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 1.8rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 0.35rem;
        }

        .field {
            margin-bottom: 1rem;
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            padding: 0.7rem 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f1115;
            color: var(--text);
            font-size: 0.9rem;
            transition: border-color 0.15s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .toggle-pw {
            position: absolute;
            right: 0.7rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.75rem;
            padding: 0;
            width: auto;
        }

        .row-between {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1.2rem;
        }

        .row-between a {
            font-size: 0.8rem;
            color: var(--primary);
            text-decoration: none;
        }

        .row-between a:hover {
            text-decoration: underline;
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button[type="submit"]:hover {
            background: var(--primary-hover);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        .spinner.active {
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            color: var(--error);
            font-size: 0.82rem;
            margin-top: 0.8rem;
            text-align: center;
            min-height: 1.1rem;
        }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .footer-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <form class="card" id="loginForm" onsubmit="return false;">
        <div class="logo">AI</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to continue to AI Assistant</p>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
                <button type="button" class="toggle-pw" onclick="togglePassword()">Show</button>
            </div>
        </div>

        <div class="row-between">
            <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" id="loginBtn" onclick="login()">
            <span class="spinner" id="spinner"></span>
            <span id="btnText">Log In</span>
        </button>

        <div class="error" id="error"></div>

        <div class="footer-link">
            Don't have an account? <a href="register.html">Sign up</a>
        </div>
    </form>

    <script>
        const AUTH_SERVICE_URL = "http://localhost:8001";

        function togglePassword() {
            const pw = document.getElementById("password");
            const btn = document.querySelector(".toggle-pw");
            const isHidden = pw.type === "password";
            pw.type = isHidden ? "text" : "password";
            btn.textContent = isHidden ? "Hide" : "Show";
        }

        function setLoading(isLoading) {
            document.getElementById("loginBtn").disabled = isLoading;
            document.getElementById("spinner").classList.toggle("active", isLoading);
            document.getElementById("btnText").textContent = isLoading ? "Logging in..." : "Log In";
        }

        async function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const errorEl = document.getElementById("error");
            errorEl.textContent = "";

            if (!email || !password) {
                errorEl.textContent = "Please fill in both fields.";
                return;
            }

            setLoading(true);

            try {
                const res = await fetch(`${AUTH_SERVICE_URL}/v1/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password }),
                });

                const data = await res.json();

                if (!res.ok) {
                    errorEl.textContent = data.detail || "Login failed. Check your credentials.";
                    setLoading(false);
                    return;
                }

                localStorage.setItem("access_token", data.access_token);
                localStorage.setItem("refresh_token", data.refresh_token);
                localStorage.setItem("user_id", data.user_id || "");
                window.location.href = "chat.html";

            } catch (e) {
                errorEl.textContent = "Cannot reach the server. Is auth-service running?";
                setLoading(false);
            }
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") login();
        });
    </script>
</body>

</html>
