<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Assistant — Reset Password</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #1a1d24;
            --border: #2a2d36;
            --text: #e4e6eb;
            --text-dim: #8b8f99;
            --primary: #4f8cff;
            --primary-hover: #3d76e0;
            --error: #ff6b6b;
            --success: #4ade80;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, sans-serif;
            background: radial-gradient(circle at top, #161a22, var(--bg));
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .card {
            background: var(--card);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            border-radius: 12px;
            margin: 0 auto 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
            margin: 0 0 0.3rem;
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 1.8rem;
            line-height: 1.4;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 0.35rem;
        }

        .field {
            margin-bottom: 1.2rem;
        }

        input {
            width: 100%;
            padding: 0.7rem 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f1115;
            color: var(--text);
            font-size: 0.9rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background: var(--primary-hover);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            color: var(--error);
            font-size: 0.82rem;
            margin-top: 0.8rem;
            text-align: center;
            min-height: 1.1rem;
        }

        .success-msg {
            color: var(--success);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 1rem;
            padding: 0.8rem;
            background: rgba(74, 222, 128, 0.08);
            border-radius: 8px;
            line-height: 1.4;
        }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .footer-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <form class="card" id="forgotForm" onsubmit="return false;">
        <div class="logo">AI</div>
        <h1>Reset your password</h1>
        <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <button type="submit" id="resetBtn" onclick="requestReset()">Send Reset Link</button>

        <div class="error" id="error"></div>
        <div class="success-msg" id="success" style="display: none;"></div>

        <div class="footer-link">
            Remembered your password? <a href="index.html">Log in</a>
        </div>
    </form>

    <script>
        const AUTH_SERVICE_URL = "http://localhost:8001";

        async function requestReset() {
            const email = document.getElementById("email").value.trim();
            const errorEl = document.getElementById("error");
            const successEl = document.getElementById("success");
            errorEl.textContent = "";
            successEl.style.display = "none";

            if (!email) {
                errorEl.textContent = "Please enter your email.";
                return;
            }

            const btn = document.getElementById("resetBtn");
            btn.disabled = true;
            btn.textContent = "Sending...";

            try {
                const res = await fetch(`${AUTH_SERVICE_URL}/v1/auth/forgot-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email }),
                });

                // নিরাপত্তার জন্য: email সত্যিই আছে কিনা তা UI থেকে প্রকাশ করা হয় না
                // (user enumeration আক্রমণ ঠেকাতে) — সবসময় একই সফল মেসেজ দেখানো হয়
                successEl.textContent = "If an account exists with that email, a reset link has been sent.";
                successEl.style.display = "block";
                btn.textContent = "Send Reset Link";
                btn.disabled = false;

            } catch (e) {
                errorEl.textContent = "Cannot reach the server. Is auth-service running?";
                btn.disabled = false;
                btn.textContent = "Send Reset Link";
            }
        }
    </script>
</body>

</html>
